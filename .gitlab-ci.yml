image: node:22-alpine

stages:
  - compile
  - test
  - security-scan
  - build
  - deploy

compile:
  stage: compile
  script:
    - npm ci --silent
    - npx tsc --noEmit
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

test:
  stage: test
  script:
    - npm ci --silent
    - npm run test -- --reporter=junit --outputFile=test-results/results.xml
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  artifacts:
    reports:
      junit: test-results/results.xml
    expire_in: 7 days

e2e-test:
  stage: test
  needs: [compile]
  image: node:22-bookworm-slim
  script:
    - npm ci --silent
    - npx playwright install chromium --with-deps
    - npm run test:e2e
  artifacts:
    when: on_failure
    paths:
      - playwright-report/
      - test-results/
    expire_in: 7 days

security-scan:
  stage: security-scan
  needs: [compile]
  script:
    - npm audit --audit-level=high
  allow_failure: true

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  needs: [test]
  script:
    - CALVER="$(date -u +%Y.%m.%d).$CI_PIPELINE_IID"
    - |
      docker build \
        --tag "$CI_REGISTRY_IMAGE:$IMAGE_TAG" \
        --tag "$CI_REGISTRY_IMAGE:$CALVER" \
        .
    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CALVER"
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
      variables:
        IMAGE_TAG: "dev"
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
      variables:
        IMAGE_TAG: "latest"
    - if: '$CI_COMMIT_TAG'
      variables:
        IMAGE_TAG: "$CI_COMMIT_TAG"

firebase-deploy:
  stage: deploy
  image: node:22-alpine
  needs: [test]
  before_script:
    - npm install -g firebase-tools
  script:
    - firebase deploy --only firestore:rules,firestore:indexes --token "$FIREBASE_TOKEN" --project "$FIREBASE_PROJECT_ID"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
